name: project-control

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source model and generated docs
        run: python3 github_project/_meta/generate.py check
