<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" /><
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>More & Profile</title>
<style>
:root{
  --bg:#070B14;--inset:#060A12;--surface:#0C1323;--elevated:#111B2E;--hover:#14223A;
  --text:#E9F2FF;--sub:#93A3BC;--muted:#62708A;--border:#22304A;--strong:#344563;
  --cyan:#31D6C4;--good:#3BDE8A;--bad:#FF596D;--warn:#FFB341;--paper:#E7DFD0;--ink:#1C1916;
  --crypto:#B783FF;--mono:"IBM Plex Mono",Consolas,monospace;--ui:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;font:14px/1.35 var(--ui);display:grid;place-items:start center;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--elevated)}
.seal{width:34px;height:34px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font:700 11px var(--mono);flex-shrink:0}
.xp-wrap{flex:1;min-width:0}.xp-label{display:flex;justify-content:space-between;color:var(--muted);font:9px var(--mono);margin-bottom:2px}
.xp-bar{height:4px;background:var(--inset);border-radius:99px;overflow:hidden;border:1px solid var(--border)}.xp-bar>i{display:block;height:100%;width:68%;background:var(--cyan);border-radius:99px}
.coins{font:700 11px var(--mono);color:var(--sub);white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--sub);display:grid;place-items:center;flex-shrink:0;cursor:pointer;font-size:15px;position:relative}
.dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.content{flex:1;overflow-y:auto;padding:14px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}
.page-title{font:700 22px var(--ui);letter-spacing:-.02em;margin-bottom:14px}
/* Profile card */
.profile-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px;margin-bottom:14px}
.profile-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.profile-seal{width:56px;height:56px;border-radius:50%;border:2px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font:700 18px var(--mono);flex-shrink:0}
.profile-info{flex:1;min-width:0}
.profile-name{font:700 16px var(--ui)}
.profile-level{font:10px var(--mono);color:var(--muted);margin-top:2px}
.skin-badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:99px;color:var(--sub);font:9px var(--mono);margin-top:4px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstat{text-align:center;padding:8px;border:1px solid var(--border);border-radius:9px;background:var(--inset)}
.pstat b{display:block;font:700 16px var(--mono);color:var(--cyan)}
.pstat small{font:8px var(--mono);color:var(--muted)}
/* Menu list */
.menu{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
.menu-item{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;background:var(--surface);cursor:pointer;color:var(--text);font-size:14px}
.menu-item:active{background:var(--hover)}
.menu-ic{width:28px;height:28px;border-radius:7px;background:var(--inset);display:grid;place-items:center;color:var(--sub);font-size:14px;flex-shrink:0}
.menu-item span:nth-child(2){flex:1}
.menu-arrow{color:var(--muted);font-size:16px}
.menu-badge{font:8px var(--mono);color:var(--cyan);border:1px solid rgba(49,214,196,.3);padding:2px 6px;border-radius:4px}
.menu-badge.warn{color:var(--warn);border-color:rgba(255,179,65,.3)}
/* Trophies mini */
.trophy-mini{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.trophy-mini::-webkit-scrollbar{display:none}
.trophy-mini-item{flex-shrink:0;width:48px;height:48px;border:1px solid var(--border);border-radius:10px;background:var(--inset);display:grid;place-items:center;position:relative}
.trophy-mini-item.r{border-color:var(--crypto)}.trophy-mini-item.r .ts{color:var(--crypto)}
.trophy-mini-item.d{border-color:var(--good)}.trophy-mini-item.d .ts{color:var(--good)}
.ts{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font:700 12px var(--mono)}
.trophy-stage{position:absolute;bottom:2px;right:3px;font:6px var(--mono);color:var(--muted)}
.section-head{font:700 13px var(--ui);margin-bottom:8px;color:var(--sub)}
.bottomnav{height:60px;flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);background:var(--elevated)}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:8px var(--mono);border:0;background:transparent;cursor:pointer}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-item.active{color:var(--cyan)}.nav-item.active::before{content:"";position:absolute;top:0;width:22px;height:2px;background:var(--cyan);border-radius:0 0 2px 2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
